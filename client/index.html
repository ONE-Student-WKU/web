<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ONE Student</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <script>
      (function () {
        // App.jsx의 테마 초기화 로직과 동일 — React가 첫 렌더링 후 useEffect에서 data-theme을
        // 적용하면 그 사이(1프레임)에 기본값인 다크 테마 배경이 잠깐 그려지는 깜빡임이 생겨서,
        // 마운트 전에 동기적으로 먼저 적용해둔다.
        var theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.fontSize = localStorage.getItem('fontSize') || 'medium';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
