# ⚠️ 아래에서 트리거하는 Railway Cron Job 서비스(reseed-SAFE-ONLY-no-seed-js)의 Start
# Command에 `npm run seed --workspace=server` (= seed.js 전체)를 절대 추가하지 말 것 —
# 가짜 학생 계정(seedStudents / seedStudentCourses)까지 승인자도 모르는 채로 운영 DB에
# 자동으로 들어가게 된다. 이 파이프라인이 자동화하는 대상은 아래 4개뿐이다:
#   seed:course-offerings / seed:curriculum / seed:regulations -- --force / seed:reference-data
# (seed:reference-data는 seed.js가 export하는 seedDepartments/seedCurriculumRequirements만
# 호출하는 wrapper — server/scripts/seedReferenceData.js 참고, 가짜 계정 함수는 export 안 됨)
name: DB Reseed (curriculum / regulations)

on:
  push:
    branches: [main]
    paths:
      - 'db/regulations/**'
      - 'db/curriculum/**'
      - 'db/seed/curriculum_requirements.json'
  # 검증 단계 임시 트리거 — 이 파일이 존재하는 어떤 브랜치에서든 Actions 탭에서 수동 실행 가능.
  # 검증이 끝난 뒤에도 지우지 않고 남겨둬도 안전하다(아래와 동일한 db-reseed 승인 게이트를 그대로 거침).
  workflow_dispatch:

permissions:
  contents: read

# 관련 파일이 짧은 시간 안에 여러 번 바뀌어도 railway redeploy가 중복/중첩 실행되지 않도록 큐잉.
# (재임베딩처럼 되돌리기 번거로운 작업이 겹치는 걸 막기 위해 진행 중인 실행은 취소하지 않는다 —
# vercel-deploy.yml의 concurrency.group 패턴은 그대로 따르되 cancel-in-progress만 false로 둠.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  reseed:
    name: Trigger reseed Cron Job on Railway
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment: db-reseed   # Phase 1에서 등록한 Required reviewers 승인 게이트가 여기서 자동 적용됨

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # 이전: `railway redeploy`만 쓰면 기존에 이미 빌드돼 있는 배포를 그대로 재실행할 뿐,
      # 체크아웃한 이 커밋을 새로 빌드하지 않는다(Railway 서비스가 GitHub과 연동돼 있지
      # 않거나 연동 브랜치/Auto-Deploy 설정이 어긋나 있으면 옛날 빌드가 계속 재시작됨 —
      # 실제로 이슈에서 관측된 증상). `railway up`은 지금 체크아웃된 디렉터리를 업로드해
      # 새로 빌드하므로, 대시보드 설정과 무관하게 항상 이 워크플로우를 트리거한 커밋이
      # 배포되는 것을 보장한다.
      #
      # 주의: `--detach`를 붙이면 빌드/배포가 끝나기 전에 다음 줄(로그 확인)로 넘어가버려서,
      # 아직 실행되지 않은/이전 배포의 로그를 읽어오는 것처럼 보이는 문제가 실제로 있었다.
      # 그래서 `--detach` 없이 빌드·배포·(Cron Job 특성상 그 직후 1회 실행까지) 완전히
      # 끝날 때까지 기다린다. `up` 뒤에 별도로 `railway redeploy`를 추가로 호출했을 때는
      # 같은 재시딩이 중복 실행되며 로그가 뒤섞이는 것을 확인해 제거했다 — `up` 단독으로
      # (검증 실행에서 확인됨) 새 코드가 정상적으로 한 번 실행된다.
      - name: Deploy checked-out commit to reseed Cron Job
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deploying commit ${{ github.sha }}"
          railway up --service reseed-SAFE-ONLY-no-seed-js

      - name: Confirm execution via logs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway logs --service reseed-SAFE-ONLY-no-seed-js | tee reseed.log

      - name: Post result summary
        run: |
          {
            echo "### Reseed deploy — commit \`${{ github.sha }}\`"
            echo '```'
            cat reseed.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
