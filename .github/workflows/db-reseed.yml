# ⚠️ Phase 4(server/scripts/seed.js 분리) 완료 전까지, 아래에서 트리거하는 Railway
# Cron Job 서비스(reseed-SAFE-ONLY-no-seed-js)의 Start Command에
# `npm run seed --workspace=server` (= seed.js 전체)를 절대 추가하지 말 것 —
# 가짜 학생 계정(seedStudents / seedStudentCourses)까지 승인자도 모르는 채로 운영 DB에
# 자동으로 들어가게 된다. 이 파이프라인이 자동화하는 대상은 아래 3개뿐이다:
#   seed:course-offerings / seed:curriculum / seed:regulations -- --force
name: DB Reseed (curriculum / regulations)

on:
  push:
    branches: [main]
    paths:
      - 'db/regulations/**'
      - 'db/curriculum/**'
  # 검증 단계 임시 트리거 — 이 파일이 존재하는 어떤 브랜치에서든 Actions 탭에서 수동 실행 가능.
  # 검증이 끝난 뒤에도 지우지 않고 남겨둬도 안전하다(아래와 동일한 db-reseed 승인 게이트를 그대로 거침).
  workflow_dispatch:

permissions:
  contents: read

# 관련 파일이 짧은 시간 안에 여러 번 바뀌어도 railway redeploy가 중복/중첩 실행되지 않도록 큐잉.
# (재임베딩처럼 되돌리기 번거로운 작업이 겹치는 걸 막기 위해 진행 중인 실행은 취소하지 않는다 —
# vercel-deploy.yml의 concurrency.group 패턴은 그대로 따르되 cancel-in-progress만 false로 둠.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  reseed:
    name: Trigger reseed Cron Job on Railway
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment: db-reseed   # Phase 1에서 등록한 Required reviewers 승인 게이트가 여기서 자동 적용됨

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Trigger reseed Cron Job
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --service reseed-SAFE-ONLY-no-seed-js --yes

      - name: Confirm execution via logs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway logs --service reseed-SAFE-ONLY-no-seed-js | tee reseed.log

      - name: Post result summary
        run: cat reseed.log >> "$GITHUB_STEP_SUMMARY"
