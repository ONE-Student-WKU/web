name: Vercel CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

# PR 댓글 작성을 위한 권한 설정
permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest

    # Vercel CLI용 전역 환경 변수 설정
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Vercel CLI 설치
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 3. Vercel 환경 설정 정보 불러오기
      - name: Pull Vercel Environment Info
        run: vercel pull --yes --environment=${{ (github.ref_name == 'main' && github.event_name == 'push') && 'production' || 'preview' }} --debug

      # 4. GitHub Actions 환경에서 프로젝트 pre-build 실행
      - name: Build Project Artifacts
        run: vercel build ${{ (github.ref_name == 'main' && github.event_name == 'push') && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      # 5. Prebuilt 아티팩트를 Vercel로 배포
      - name: Deploy to Vercel
        id: deploy
        run: |
          if [ "${{ github.ref_name }}" = "main" ] && [ "${{ github.event_name }}" = "push" ]; then
            URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "DEPLOY_URL=$URL" >> $GITHUB_ENV

      # 6. PR 요청 시 Preview 배포 URL을 댓글로 작성
      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Vercel Preview Deployment Ready!**\n\n🔗 **Preview URL:** ${process.env.DEPLOY_URL}`
            })
        env:
          DEPLOY_URL: ${{ env.DEPLOY_URL }}
