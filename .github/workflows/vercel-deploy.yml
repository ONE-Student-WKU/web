name: Vercel CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

# 동일 브랜치/PR에 연속 푸시 발생 시 이전 워크플로우 실행을 자동 취소하여 동시 배포 겹침 방지
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PR 댓글 작성을 위한 권한 설정
permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest

    # Vercel CLI용 전역 환경 변수 설정
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Vercel CLI 설치
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 3. Vercel 환경 설정 정보 불러오기 (디버그 플래그 제거하여 빌드 로그 정리)
      - name: Pull Vercel Environment Info
        run: vercel pull --yes --environment=${{ (github.ref_name == 'main' && github.event_name == 'push') && 'production' || 'preview' }}

      # 4. 프로젝트 pre-build 실행 (전역 env의 VERCEL_TOKEN을 사용하므로 중복 token 옵션 제거)
      - name: Build Project Artifacts
        run: vercel build ${{ (github.ref_name == 'main' && github.event_name == 'push') && '--prod' || '' }}

      # 5. Prebuilt 아티팩트를 Vercel로 배포 (전역 env의 VERCEL_TOKEN을 사용하므로 중복 token 옵션 제거)
      - name: Deploy to Vercel
        id: deploy
        run: |
          if [ "${{ github.ref_name }}" = "main" ] && [ "${{ github.event_name }}" = "push" ]; then
            URL=$(vercel deploy --prebuilt --prod)
          else
            URL=$(vercel deploy --prebuilt)
          fi
          echo "DEPLOY_URL=$URL" >> $GITHUB_ENV

      # 6. PR 요청 시 Preview 배포 URL 작성 (기존 댓글을 찾아 수정 갱신하여 중복 댓글 누적 방지)
      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: vercel-preview
          message: |
            **Vercel Preview Deployment Ready!**

            **Preview URL:** ${{ env.DEPLOY_URL }}
